<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Section Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh; /* full viewport height */
    }

    .section {
      flex: 1; /* divide evenly */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
    }

    .section1 { background: #3498db; }
    .section2 { background: #2ecc71; }
    .section3 { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="section section1">Section 1</div>
    <div class="section section2">Section 2</div>
    <div class="section section3">Section 3</div>
  </div>
</body>
</html>
